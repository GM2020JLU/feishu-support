# Deployment example: install exactly one profile as a root-owned worker drop-in.
# Provision the executable and native credentials separately; no secrets here.
[Service]
Environment=K3_SUPPORT_AGENT_EXECUTABLE=/opt/opencode/bin/opencode
Environment=K3_SUPPORT_AGENT_HOME=/var/lib/k3-support-worker/opencode
StateDirectory=k3-support-worker/opencode
