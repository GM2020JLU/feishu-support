# Deployment example: install exactly one profile as a root-owned worker drop-in.
# Provision the executable and native credentials separately; no secrets here.
[Service]
Environment=K3_SUPPORT_AGENT_EXECUTABLE=/opt/hermes/venv/bin/python
Environment=K3_SUPPORT_AGENT_HOME=/var/lib/k3-support-worker/hermes
StateDirectory=k3-support-worker/hermes
